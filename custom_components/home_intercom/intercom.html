  var panelBase = path.indexOf('/home-intercom') === 0 ? '/home-intercom' : '/home_intercom';
  window.API_BASE = isHA ? '/api/home_intercom' : '';
  window.STATIC_BASE = isHA ? panelBase + '/static' : '/static';
  window.PANEL_BASE = isHA ? panelBase : '';
})();
</script>

})();

<script>
// --- Shared with ha_client.py EntityStatus / PlayError ---
const EntityStatus = { ONLINE: "online", UNAVAILABLE: "unavailable", NO_PLAY_MEDIA: "no_play_media" };
const PlayError   = { PLAY_FAILED: "play_failed", MA_FAILED: "ma_failed" };
const UNAVAILABLE_CLASS = "unavailable";

const GRID = document.getElementById('grid');
const RECORD_URL = (window.API_BASE || '') + '/record';
const CHIME_URL = (window.API_BASE || '') + '/chime';
const MAX_CHIME_SECS = 10;
// sessionStorage flag: auto-reload at most once per tab session on 401 (issue #54)
const RELOAD_ONCE_KEY = 'hi401reload';

// Build headers dict for HA API calls.
// Priority: server-injected PWA token → HA localStorage token
function authHeaders(extra) {
  var h = extra || {};
  // Server-injected shared secret (works everywhere: web, Companion App, etc.)
  if (window._PWA_TOKEN) {
    h['X-PWA-Token'] = window._PWA_TOKEN;
    return h;
  }
  // Fallback: HA localStorage token (desktop/mobile web)
  try {
    var t = JSON.parse(localStorage.getItem('hassTokens') || 'null');
    if (t && t.access_token) {
      h['Authorization'] = 'Bearer ' + t.access_token;
      return h;
    }
    t = JSON.parse(localStorage.getItem('hass_auth') || 'null');
    if (t && t.access_token) {
      h['Authorization'] = 'Bearer ' + t.access_token;
      return h;
    }
    var raw = localStorage.getItem('access_token');
    if (raw) {
      h['Authorization'] = 'Bearer ' + raw;
      return h;
    }
  } catch(e) {}
  return h;
}
// PCM target rate fetched from /version on startup
let TARGET_RATE = 16000;  // fallback, overwritten by server

let mediaRecorder = null;
let audioChunks = [];
let currentTarget = '';
let currentCard = null;
let ROOM_NAMES = {};

// Room icon mapping (extensible, falls back to 📢)
const ROOM_ICONS = {
  all:     '📢',
  living:  '🛋️',
  bedroom: '🛏️',
  study:   '📚',
  cinema:  '🎬',
};
function roomIcon(target) {
  return ROOM_ICONS[target] || '🔊';
}

function makeCard(target, name, isBroadcast) {
  const card = document.createElement('div');
  card.className = 'room-card' + (isBroadcast ? ' broadcast-card' : '');
  card.id = 'card-' + target;

  const pttHtml = `
    <div class="ptt-wrap">
      <div class="waves"></div>
      <button class="ptt-btn">
        <div class="ptt-icon" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="checkmark">✓</div>
      </button>
    </div>`;

  if (isBroadcast) {
    card.innerHTML = `
      <div class="broadcast-main">
        <div class="broadcast-info">
          <div class="broadcast-label" data-i18n="broadcastAll">${name}</div>
          <div class="status">${I18N.t('statusReady')}</div>
        </div>
        ${pttHtml}
      </div>`;
  } else {
    card.innerHTML = `
      <div class="room-header">
        <div class="room-info">
          <div class="room-name" data-room-name="${target}">${name}</div>
          <div class="room-meta">
            <span class="dot"></span>
            <span class="device-name">…</span>
          </div>
        </div>
        <span class="room-icon">${roomIcon(target)}</span>
      </div>
      ${pttHtml}
      <div class="status">${I18N.t('statusReady')}</div>`;
  }

  const btn = card.querySelector('.ptt-btn');

  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    startRecording(target, card);
  });
  btn.addEventListener('pointerup', (e) => {
    e.preventDefault();
    stopRecording();
  });
  btn.addEventListener('lostpointercapture', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  });
  btn.addEventListener('touchstart', e => e.preventDefault());
  btn.addEventListener('contextmenu', e => e.preventDefault());

  if (window._INSECURE_ORIGIN) {
    btn.disabled = true;
    card.classList.add(UNAVAILABLE_CLASS);
    card.querySelector('.status').textContent = I18N.t('secInsecureTitle');
  }

  return card;
}

// Preview-only mock data (used only before first successful HA status load)
const PREVIEW_DEVICE_NAMES = {
  living: 'Living Room Speaker',
  bedroom: 'Bedroom Speaker',
};

const PREVIEW_DEMO_STATUS = {
  living: { status: EntityStatus.ONLINE, friendly_name: 'Living Room Speaker' },
  bedroom: { status: EntityStatus.UNAVAILABLE, friendly_name: 'Bedroom Speaker' },
};

let haStatusLoaded = false;

function applyPreviewFallback() {
  for (const [key, friendly_name] of Object.entries(PREVIEW_DEVICE_NAMES)) {
    const card = document.getElementById('card-' + key);
    const deviceEl = card?.querySelector('.device-name');
    if (deviceEl) deviceEl.textContent = friendly_name;
  }
  applyRoomStatus(PREVIEW_DEMO_STATUS);
}

function applyRoomStatus(status) {
  for (const [key, info] of Object.entries(status)) {
    const card = document.getElementById('card-' + key);
    if (!card) continue;
    const roomState = typeof info === 'object' ? info.status : info;
    const deviceEl = card.querySelector('.device-name');
    if (deviceEl && typeof info === 'object' && info.friendly_name) {
      deviceEl.textContent = info.friendly_name;
    }
    const dot = card.querySelector('.dot');
    const btn = card.querySelector('.ptt-btn');
    if (roomState === EntityStatus.ONLINE) {
      if (dot) dot.className = 'dot dot-online';
      if (!window._INSECURE_ORIGIN) {
        card.classList.remove(UNAVAILABLE_CLASS);
        if (btn) btn.disabled = false;
        const st = card.querySelector('.status');
        if (st) st.textContent = I18N.t('statusReady');
      }
    } else if (roomState === EntityStatus.NO_PLAY_MEDIA) {
      if (dot) dot.className = 'dot dot-error';
      if (!window._INSECURE_ORIGIN) {
        card.classList.add(UNAVAILABLE_CLASS);
        if (btn) btn.disabled = true;
        const st = card.querySelector('.status');
        if (st) st.textContent = I18N.t('statusSkipped');
      }
    } else {
      if (dot) dot.className = 'dot dot-error';
      if (!window._INSECURE_ORIGIN) {
        card.classList.add(UNAVAILABLE_CLASS);
        if (btn) btn.disabled = true;
        const st = card.querySelector('.status');
        if (st) st.textContent = I18N.t('statusUnavailable');
      }
    }
  }
}

async function loadRooms() {
  // Expose room data for i18n language switching
  window._ROOM_DATA = {};
  window._ROOM_DATA['all'] = { name: I18N.t('broadcastAll'), name_en: 'All' };
  ROOM_NAMES['all'] = I18N.t('broadcastAll');
  GRID.appendChild(makeCard('all', I18N.t('broadcastAll'), true));

  try {
    const resp = await fetch((window.API_BASE || '') + '/rooms', { credentials: 'same-origin', headers: authHeaders() });
    const rooms = await resp.json();
    for (const [key, room] of Object.entries(rooms)) {
      window._ROOM_DATA[key] = room;
      ROOM_NAMES[key] = room.name;
      GRID.appendChild(makeCard(key, room.name, false));
    }
  } catch (e) {
    const firstStatus = GRID.querySelector('.status');
    if (firstStatus) firstStatus.textContent = I18N.t('statusLoadFailed');
  }
}

function setCardState(card, state, msg) {
  ['recording','sending','sent'].forEach(c => card.classList.remove(c));
  if (state) card.classList.add(state);
  card.querySelector('.status').textContent = msg;
}

// ——— Read-only device list (issue #52) ———
// window._DEVICES caches the last fetch so language switches re-render instantly.
window._DEVICES = null;

window.renderDevices = function () {
  const section = document.getElementById('devices-section');
  const list = document.getElementById('devices-list');
  const devices = window._DEVICES;
  if (!devices || !Object.keys(devices).length) {
    section.hidden = true;
    return;
  }
  const macs = Object.keys(devices).sort((a, b) =>
    (devices[a].name || a).localeCompare(devices[b].name || b));
  list.innerHTML = '';
  for (const mac of macs) {
    const d = devices[mac];
    const row = document.createElement('div');
    row.className = 'device-row' + (d.revoked ? ' revoked' : '');

    const name = document.createElement('span');
    name.className = 'device-name';
    name.textContent = d.name || mac;

    const room = document.createElement('span');
    room.className = 'device-room';
    room.textContent = (d.room && ROOM_NAMES[d.room]) || '—';

    const meta = document.createElement('span');
    meta.className = 'device-meta';
    const lastSeen = (d.last_seen || '').replace('T', ' ').slice(0, 16);
    meta.textContent = [d.firmware_version, lastSeen].filter(Boolean).join(' · ');

    row.appendChild(name);
    row.appendChild(room);
    row.appendChild(meta);
    row.title = mac;
    list.appendChild(row);
  }
  section.hidden = false;
};

async function loadDevices() {
  try {
    const resp = await fetch((window.API_BASE || '') + '/devices', {
      credentials: 'same-origin',
      headers: authHeaders(),
    });
    if (!resp.ok) return; // 401/404: stay hidden
    window._DEVICES = await resp.json();
    window.renderDevices();
  } catch (e) { /* network error: stay hidden */ }
}

async function startRecording(target, card) {
  currentTarget = target;
  currentCard = card;
  audioChunks = [];

  if (card.classList.contains(UNAVAILABLE_CLASS)) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      mediaRecorder = null;
      processAndSend();
    };
    mediaRecorder.start();
    setCardState(card, 'recording', I18N.t('statusRecording'));
  } catch (e) {
    setCardState(card, '', I18N.t('micError') + e.message);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    setCardState(currentCard, 'sending', I18N.t('statusSending'));
  }
}

async function decodeAndResampleToInt16(arrayBuffer, maxDurationSecs) {
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuf = await actx.decodeAudioData(arrayBuffer.slice(0));
  const srcRate = audioBuf.sampleRate;
  const srcData = audioBuf.getChannelData(0);
  actx.close();

  const duration = srcData.length / srcRate;
  if (maxDurationSecs && duration > maxDurationSecs) {
    throw new Error('too_long');
  }

  const offlineCtx = new OfflineAudioContext(1, Math.ceil(duration * TARGET_RATE), TARGET_RATE);
  const bufferSrc = offlineCtx.createBufferSource();
  const offlineBuf = offlineCtx.createBuffer(1, srcData.length, srcRate);
  offlineBuf.copyToChannel(srcData, 0);
  bufferSrc.buffer = offlineBuf;
  bufferSrc.connect(offlineCtx.destination);
  bufferSrc.start(0);

  const rendered = await offlineCtx.startRendering();
  const resampled = rendered.getChannelData(0);
  const pcm = new Int16Array(resampled.length);
  for (let i = 0; i < resampled.length; i++) {
    const s = Math.max(-1, Math.min(1, resampled[i]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return pcm;
}

function encodeWav(int16, sampleRate) {
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
  const blockAlign = numChannels * (bitsPerSample / 8);
  const dataSize = int16.length * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < int16.length; i++, offset += 2) {
    view.setInt16(offset, int16[i], true);
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

async function processAndSend() {
  const webm = new Blob(audioChunks, { type: 'audio/webm' });
  let sentCurrent = true;

  try {
    const arrayBuf = await webm.arrayBuffer();
    const pcm = await decodeAndResampleToInt16(arrayBuf);

    const resp = await fetch(RECORD_URL + '?target=' + currentTarget + '&rate=' + TARGET_RATE, {
      method: 'POST',
      credentials: 'same-origin',
      headers: authHeaders(),
      body: new Blob([new Uint8Array(pcm.buffer, 0, pcm.byteLength)]),
    });

    if (resp.ok) {
      const data = await resp.json();
      const errors = data.errors || [];
      sentCurrent = true;  // show "sent" unless current card is an error card
      if (errors.length > 0) {
        // Map entity → room key for card lookup
        const entityToKey = {};
        for (const [key, room] of Object.entries(window._ROOM_DATA || {})) {
          if (room.entity_id) entityToKey[room.entity_id] = key;
        }
        // Show error on each skipped room's card
        for (const e of errors) {
          const key = entityToKey[e.entity_id];
          if (!key) continue;
          const card = document.getElementById('card-' + key);
          if (!card) continue;
          if (card === currentCard) sentCurrent = false;
          // Turn dot red
          const dot = card.querySelector('.dot');
          if (dot) dot.className = 'dot dot-error';
          const ERROR_MSG = {
            [EntityStatus.UNAVAILABLE]: I18N.t('statusUnavailable'),
            [PlayError.PLAY_FAILED]:    I18N.t('statusPlayFailed'),
            [PlayError.MA_FAILED]:      I18N.t('statusMAFailed'),
          };
          const msg = ERROR_MSG[e.error] || I18N.t('statusSkipped');
          setCardState(card, '', msg);
        }
      }
      if (sentCurrent) setCardState(currentCard, 'sent', I18N.t('statusSent'));
    } else if (resp.status === 401 && !sessionStorage.getItem(RELOAD_ONCE_KEY)) {
      // Issue #54: page holds a stale token (HA restarted, .storage reset,
      // backup restored) — reload once to pick up the fresh injected token.
      sessionStorage.setItem(RELOAD_ONCE_KEY, '1');
      location.reload();
      return;
    } else {
      setCardState(currentCard, '', I18N.t('statusFailed') + ' ' + resp.status);
    }
  } catch (e) {
    setCardState(currentCard, '', I18N.t('statusNetworkError'));
    console.error('processAndSend:', e);
  }

  setTimeout(() => {
    if (currentCard && sentCurrent) setCardState(currentCard, '', I18N.t('statusReady'));
  }, 1500);
}

async function pollSpeakerStatus() {
  try {
    const resp = await fetch((window.API_BASE || '') + '/rooms/status', { credentials: 'same-origin' });
    if (!resp.ok) throw new Error('status unavailable');
    const status = await resp.json();
    if (status.error) throw new Error(status.error);
    applyRoomStatus(status);
    haStatusLoaded = true;
  } catch (e) {
    if (!haStatusLoaded) applyPreviewFallback();
  }
}

// --- Custom chime settings (issue #66) ---
const CHIME_FILENAME_KEY = 'intercom-chime-display-name';
let chimeState = { custom: false, url: '' };
let chimePreviewAudio = null;
let chimeMetaCache = null;
let chimeMetaLoadId = 0;

function resolveChimePlayUrl(url) {
  const staticBase = (window.STATIC_BASE || '/static').replace(/\/$/, '');
  if (!url) return staticBase + '/pre_announce.wav';
  if (/^https?:\/\//i.test(url)) return url;
  if (url.indexOf('/static/') !== -1) {
    const file = url.split('/static/').pop().replace(/^\//, '');
    return staticBase + '/' + file;
  }
  return url;
}

function setChimeMsg(text) {
  const el = document.getElementById('chime-msg');
  if (el) el.textContent = text || '';
}

function isChimeCustom(state) {
  state = state || chimeState;
  if (state.custom === true) return true;
  if (state.custom === false) return false;
  return /custom_chime\.wav/i.test(state.url || '');
}

function getChimeDisplayFilename() {
  if (!isChimeCustom()) return I18N.t('chimeDefault');
  return localStorage.getItem(CHIME_FILENAME_KEY) || 'custom_chime.wav';
}

function setChimeDisplayFilename(name) {
  if (name) localStorage.setItem(CHIME_FILENAME_KEY, name);
  else localStorage.removeItem(CHIME_FILENAME_KEY);
}

function formatChimeMeta(duration, sampleRate) {
  if (!duration || !sampleRate) return '—';
  const secs = duration < 10 ? duration.toFixed(1) : Math.round(duration).toString();
  const rateKhz = Math.round(sampleRate / 1000);
  return secs + ' s · ' + rateKhz + ' kHz ' + I18N.t('chimeMono');
}

function computeWaveformPeaks(audioBuffer, barCount) {
  const data = audioBuffer.getChannelData(0);
  const blockSize = Math.max(1, Math.floor(data.length / barCount));
  const peaks = [];
  for (let i = 0; i < barCount; i++) {
    let peak = 0;
    const start = i * blockSize;
    for (let j = 0; j < blockSize; j++) {
      peak = Math.max(peak, Math.abs(data[start + j] || 0));
    }
    peaks.push(peak);
  }
  return peaks;
}

function drawChimeWaveform(peaks) {
  const canvas = document.getElementById('chime-waveform');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (!peaks || !peaks.length) return;

  const barW = w / peaks.length;
  const gap = 1;
  ctx.fillStyle = '#555';
  for (let i = 0; i < peaks.length; i++) {
    const barH = Math.max(2, peaks[i] * h * 0.9);
    const x = i * barW + gap / 2;
    const y = (h - barH) / 2;
    ctx.fillRect(x, y, Math.max(1, barW - gap), barH);
  }
}

function updateChimeMetaUI() {
  const filenameEl = document.getElementById('chime-filename');
  const metaEl = document.getElementById('chime-meta');
  if (filenameEl) filenameEl.textContent = getChimeDisplayFilename();
  if (metaEl) {
    metaEl.textContent = chimeMetaCache
      ? formatChimeMeta(chimeMetaCache.duration, chimeMetaCache.sampleRate)
      : '—';
  }
  drawChimeWaveform(chimeMetaCache && chimeMetaCache.peaks);
}

async function loadChimeAudioMeta() {
  const loadId = ++chimeMetaLoadId;
  const src = resolveChimePlayUrl(chimeState.url);
  try {
    const resp = await fetch(src, { credentials: 'same-origin', cache: 'no-store' });
    if (!resp.ok) throw new Error('fetch failed');
    const arrayBuffer = await resp.arrayBuffer();
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuf = await actx.decodeAudioData(arrayBuffer.slice(0));
    actx.close();
    if (loadId !== chimeMetaLoadId) return;
    chimeMetaCache = {
      duration: audioBuf.duration,
      sampleRate: audioBuf.sampleRate,
      peaks: computeWaveformPeaks(audioBuf, 40),
    };
    updateChimeMetaUI();
  } catch (e) {
    if (loadId !== chimeMetaLoadId) return;
    chimeMetaCache = null;
    updateChimeMetaUI();
    console.error('loadChimeAudioMeta:', e);
  }
}

function setChimePlayButton(playing) {
  const btn = document.getElementById('chime-play');
  const icon = btn && btn.querySelector('.chime-play-icon');
  if (!icon) return;
  icon.textContent = playing ? '■' : '▶';
  if (btn) {
    btn.classList.toggle('playing', playing);
    btn.setAttribute('aria-label', I18N.t('chimePreview'));
  }
}

function updateChimeStatusUI() {
  const custom = isChimeCustom();
  const resetBtn = document.getElementById('chime-reset');
  if (resetBtn) {
    resetBtn.disabled = !custom;
    if (custom) resetBtn.removeAttribute('disabled');
    else resetBtn.setAttribute('disabled', '');
  }
  updateChimeMetaUI();
  loadChimeAudioMeta();
}

async function refreshChimeStatus() {
  try {
    const resp = await fetch(CHIME_URL, {
      credentials: 'same-origin',
      cache: 'no-store',
    });
    if (!resp.ok) return;
    chimeState = await resp.json();
    updateChimeStatusUI();
  } catch (e) {
    console.error('refreshChimeStatus:', e);
  }
}

function playChimePreview(audio) {
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      audio.removeEventListener('canplaythrough', onReady);
      audio.removeEventListener('error', onError);
    };
    const onReady = () => {
      cleanup();
      audio.play().then(resolve).catch(reject);
    };
    const onError = () => {
      cleanup();
      reject(audio.error || new Error('audio error'));
    };

    if (audio.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
      audio.play().then(resolve).catch(reject);
      return;
    }

    audio.addEventListener('canplaythrough', onReady, { once: true });
    audio.addEventListener('error', onError, { once: true });
    audio.load();
  });
}

async function previewChime() {
  setChimeMsg('');
  const src = resolveChimePlayUrl(chimeState.url);
  if (chimePreviewAudio) {
    chimePreviewAudio.pause();
    chimePreviewAudio = null;
    setChimePlayButton(false);
  }
  chimePreviewAudio = new Audio(src);
  chimePreviewAudio.addEventListener('ended', () => {
    setChimePlayButton(false);
    chimePreviewAudio = null;
  }, { once: true });
  try {
    setChimePlayButton(true);
    await playChimePreview(chimePreviewAudio);
  } catch (e) {
    setChimePlayButton(false);
    chimePreviewAudio = null;
    setChimeMsg(I18N.t('chimePreviewFail'));
    console.error('previewChime:', e);
  }
}

async function uploadChimeFile(file) {
  if (!file) return;
  setChimeMsg('');
  try {
    const pcm = await decodeAndResampleToInt16(await file.arrayBuffer(), MAX_CHIME_SECS);
    const wav = encodeWav(pcm, TARGET_RATE);
    const resp = await fetch(CHIME_URL, {
      method: 'POST',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: authHeaders({ 'Content-Type': 'application/octet-stream' }),
      body: wav,
    });
    if (resp.ok) {
      const data = await resp.json();
      chimeState = {
        custom: true,
        url: data.url || chimeState.url,
        default_url: chimeState.default_url || ((window.STATIC_BASE || '/static') + '/pre_announce.wav'),
      };
      setChimeDisplayFilename(file.name);
      updateChimeStatusUI();
      setChimeMsg(I18N.t('chimeUploadOk'));
      return;
    }
    if (resp.status === 401 && !sessionStorage.getItem(RELOAD_ONCE_KEY)) {
      sessionStorage.setItem(RELOAD_ONCE_KEY, '1');
      location.reload();
      return;
    }
    let err = I18N.t('chimeUploadFail');
    try {
      const data = await resp.json();
      if (data.error) err = data.error;
    } catch (e) {}
    setChimeMsg(err);
  } catch (e) {
    if (e && e.message === 'too_long') {
      setChimeMsg(I18N.t('chimeUploadTooLong'));
    } else {
      setChimeMsg(I18N.t('chimeUploadFail'));
      console.error('uploadChimeFile:', e);
    }
  }
}

async function resetChime() {
  setChimeMsg('');
  try {
    const resp = await fetch(CHIME_URL, {
      method: 'DELETE',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: authHeaders(),
    });
    if (resp.ok) {
      chimeState = { custom: false, url: '' };
      setChimeDisplayFilename('');
      await refreshChimeStatus();
      setChimeMsg(I18N.t('chimeResetOk'));
      return;
    }
    if (resp.status === 401 && !sessionStorage.getItem(RELOAD_ONCE_KEY)) {
      sessionStorage.setItem(RELOAD_ONCE_KEY, '1');
      location.reload();
      return;
    }
    setChimeMsg(I18N.t('chimeUploadFail'));
  } catch (e) {
    setChimeMsg(I18N.t('chimeUploadFail'));
    console.error('resetChime:', e);
  }
}

function openSettingsPanel() {
  const overlay = document.getElementById('settings-overlay');
  const toggle = document.getElementById('settings-toggle');
  if (!overlay || !toggle) return;
  if (typeof I18N.closeLangDropdown === 'function') I18N.closeLangDropdown();
  overlay.hidden = false;
  toggle.setAttribute('aria-expanded', 'true');
  setChimeMsg('');
  refreshChimeStatus();
}

function closeSettingsPanel() {
  const overlay = document.getElementById('settings-overlay');
  const toggle = document.getElementById('settings-toggle');
  if (overlay) overlay.hidden = true;
  if (toggle) toggle.setAttribute('aria-expanded', 'false');
  if (chimePreviewAudio) {
    chimePreviewAudio.pause();
    chimePreviewAudio = null;
    setChimePlayButton(false);
  }
}

function initChimeSettings() {
  const toggle = document.getElementById('settings-toggle');
  const overlay = document.getElementById('settings-overlay');
  const closeBtn = document.getElementById('settings-close');
  const playBtn = document.getElementById('chime-play');
  const resetBtn = document.getElementById('chime-reset');
  const fileInput = document.getElementById('chime-file');
  if (!toggle || !overlay) return;

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (overlay.hidden) openSettingsPanel();
    else closeSettingsPanel();
  });

  closeBtn?.addEventListener('click', closeSettingsPanel);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeSettingsPanel();
  });
  overlay.querySelector('.settings-panel')?.addEventListener('click', (e) => e.stopPropagation());

  playBtn?.addEventListener('click', previewChime);
  resetBtn?.addEventListener('click', resetChime);
  fileInput?.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    uploadChimeFile(file);
    e.target.value = '';
  });

  window.addEventListener('resize', () => {
    drawChimeWaveform(chimeMetaCache && chimeMetaCache.peaks);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay && !overlay.hidden) closeSettingsPanel();
  });

  const closeLabel = I18N.t('settingsClose');
  if (closeBtn) closeBtn.setAttribute('aria-label', closeLabel);
  toggle.setAttribute('aria-label', I18N.t('settingsTitle'));
  if (playBtn) playBtn.setAttribute('aria-label', I18N.t('chimePreview'));
  updateChimeStatusUI();
}

window.updateChimeStatusUI = updateChimeStatusUI;

// Detect insecure context (HTTP without localhost) — getUserMedia requires HTTPS
(function checkSecureContext() {
  if (!window.isSecureContext) {
    window._INSECURE_ORIGIN = true;

    var banner = document.createElement('div');
    banner.className = 'insecure-banner';
    banner.innerHTML =
      '<div class="insecure-icon" aria-hidden="true">🔒</div>' +
      '<div>' +
        '<div class="insecure-title" data-i18n="secInsecureTitle">' + I18N.t('secInsecureTitle') + '</div>' +
        '<div class="insecure-hint" data-i18n="secInsecureHint">' + I18N.t('secInsecureHint') + '</div>' +
      '</div>';
    var grid = document.getElementById('grid');
    if (grid) grid.parentNode.insertBefore(banner, grid);
  }
})();

loadRooms().then(() => { pollSpeakerStatus(); loadDevices(); });
setInterval(pollSpeakerStatus, 30000);
initChimeSettings();

// Show version number
fetch((window.API_BASE || '') + '/version', { credentials: 'same-origin' }).then(r => r.json()).then(d => {
  document.getElementById('ver').textContent = d.version;
}).catch(() => {
  document.getElementById('ver').textContent = '';
});
