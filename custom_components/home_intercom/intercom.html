<title>home-intercom</title>
<script>
// Detect running context: container vs HA integration panel
(function(){
  var path = window.location.pathname;
  var isHA = path.indexOf('/home-intercom') === 0 || path.indexOf('/home_intercom') === 0;
  var panelBase = path.indexOf('/home-intercom') === 0 ? '/home-intercom' : '/home_intercom';
  window.API_BASE = isHA ? '/api/home_intercom' : '';
  window.STATIC_BASE = isHA ? panelBase + '/static' : '/static';
  window.PANEL_BASE = isHA ? panelBase : '';
})();
</script>
<script>
// Set initial title + theme before CSS/i18n to avoid a flash of the wrong look
(function(){
  var lang = localStorage.getItem("intercom-lang") || "";
  // Read HA user language from localStorage (same origin)
  var haLang = localStorage.getItem("selectedLanguage") || "";
  var isEn = lang === "en" || (!lang && (haLang.includes("en") || haLang.includes("en-")));
  document.title = isEn ? "Home Intercom" : "家庭广播";

  var pref = localStorage.getItem("intercom-theme") || "auto";
  if (pref !== "light" && pref !== "dark") pref = "auto";
  var dark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
  var theme = pref === "light" ? "light" : pref === "dark" ? "dark" : (dark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.setAttribute("data-theme-pref", pref);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#f3f3f4" : "#0f0f0f");
})();
</script>
<script src="/static/i18n.js"></script>

<body>

<div class="container">
  <div class="header">

<script>
// --- Shared with ha_client.py EntityStatus / PlayError ---
const EntityStatus = { ONLINE: "online", UNAVAILABLE: "unavailable", NO_PLAY_MEDIA: "no_play_media" };
const PlayError   = { PLAY_FAILED: "play_failed", MA_FAILED: "ma_failed" };
const UNAVAILABLE_CLASS = "unavailable";

const GRID = document.getElementById('grid');
const RECORD_URL = (window.API_BASE || '') + '/record';
const CHIME_URL = (window.API_BASE || '') + '/chime';
const MAX_CHIME_SECS = 10;
// sessionStorage flag: auto-reload at most once per tab session on 401 (issue #54)
const RELOAD_ONCE_KEY = 'hi401reload';

// Build headers dict for HA API calls.
// Priority: server-injected PWA token → HA localStorage token
function authHeaders(extra) {
  var h = extra || {};
  // Server-injected shared secret (works everywhere: web, Companion App, etc.)
  if (window._PWA_TOKEN) {
    h['X-PWA-Token'] = window._PWA_TOKEN;
    return h;
  }
  // Fallback: HA localStorage token (desktop/mobile web)
  try {
    var t = JSON.parse(localStorage.getItem('hassTokens') || 'null');
    if (t && t.access_token) {
      h['Authorization'] = 'Bearer ' + t.access_token;
      return h;
    }
    t = JSON.parse(localStorage.getItem('hass_auth') || 'null');
    if (t && t.access_token) {
      h['Authorization'] = 'Bearer ' + t.access_token;
      return h;
    }
    var raw = localStorage.getItem('access_token');
    if (raw) {
      h['Authorization'] = 'Bearer ' + raw;
      return h;
    }
  } catch(e) {}
  return h;
}
// PCM target rate fetched from /version on startup
let TARGET_RATE = 16000;  // fallback, overwritten by server

let mediaRecorder = null;
let audioChunks = [];
let currentTarget = '';
let currentCard = null;
let ROOM_NAMES = {};

// Room icon mapping (extensible, falls back to 📢)
const ROOM_ICONS = {
  all:     '📢',
  living:  '🛋️',
  bedroom: '🛏️',
  study:   '📚',
  cinema:  '🎬',
};
function roomIcon(target) {
  return ROOM_ICONS[target] || '🔊';
}

function makeCard(target, name, isBroadcast) {
  const card = document.createElement('div');
  card.className = 'room-card' + (isBroadcast ? ' broadcast-card' : '');
  card.id = 'card-' + target;

  const pttHtml = `
    <div class="ptt-wrap">
      <div class="waves"></div>
      <button class="ptt-btn">
        <div class="ptt-icon" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="checkmark">✓</div>
      </button>
    </div>`;

  if (isBroadcast) {
    card.innerHTML = `
      <div class="broadcast-main">
        <div class="broadcast-info">
          <div class="broadcast-label" data-i18n="broadcastAll">${name}</div>
          <div class="status">${I18N.t('statusReady')}</div>
        </div>
        ${pttHtml}
      </div>`;
  } else {
    card.innerHTML = `
      <div class="room-header">
        <div class="room-info">
          <div class="room-name" data-room-name="${target}">${name}</div>
          <div class="room-meta">
            <span class="dot"></span>
            <span class="device-name">…</span>
          </div>
        </div>
        <span class="room-icon">${roomIcon(target)}</span>
      </div>
      ${pttHtml}
      <div class="status">${I18N.t('statusReady')}</div>`;
  }

  const btn = card.querySelector('.ptt-btn');

  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    startRecording(target, card);
  });
  btn.addEventListener('pointerup', (e) => {
    e.preventDefault();
    stopRecording();
  });
  btn.addEventListener('lostpointercapture', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  });
  btn.addEventListener('touchstart', e => e.preventDefault());
  btn.addEventListener('contextmenu', e => e.preventDefault());

  if (window._INSECURE_ORIGIN) {
    btn.disabled = true;
    card.classList.add(UNAVAILABLE_CLASS);
    card.querySelector('.status').textContent = I18N.t('secInsecureTitle');
  }

  return card;
}

// Preview-only mock data (used only before first successful HA status load)
const PREVIEW_DEVICE_NAMES = {
  living: 'Living Room Speaker',
  bedroom: 'Bedroom Speaker',
};

const PREVIEW_DEMO_STATUS = {
  living: { status: EntityStatus.ONLINE, friendly_name: 'Living Room Speaker' },
  bedroom: { status: EntityStatus.UNAVAILABLE, friendly_name: 'Bedroom Speaker' },
};

let haStatusLoaded = false;

function applyPreviewFallback() {
  for (const [key, friendly_name] of Object.entries(PREVIEW_DEVICE_NAMES)) {
    const card = document.getElementById('card-' + key);
    const deviceEl = card?.querySelector('.device-name');
    if (deviceEl) deviceEl.textContent = friendly_name;
  }
  applyRoomStatus(PREVIEW_DEMO_STATUS);
}

function applyRoomStatus(status) {
  for (const [key, info] of Object.entries(status)) {
    const card = document.getElementById('card-' + key);
    if (!card) continue;
    const roomState = typeof info === 'object' ? info.status : info;
    const deviceEl = card.querySelector('.device-name');
    if (deviceEl && typeof info === 'object' && info.friendly_name) {
      deviceEl.textContent = info.friendly_name;
    }
    const dot = card.querySelector('.dot');
    const btn = card.querySelector('.ptt-btn');
    if (roomState === EntityStatus.ONLINE) {
      if (dot) dot.className = 'dot dot-online';
      if (!window._INSECURE_ORIGIN) {
        card.classList.remove(UNAVAILABLE_CLASS);
        if (btn) btn.disabled = false;
        const st = card.querySelector('.status');
        if (st) st.textContent = I18N.t('statusReady');
      }
    } else if (roomState === EntityStatus.NO_PLAY_MEDIA) {
      if (dot) dot.className = 'dot dot-error';
      if (!window._INSECURE_ORIGIN) {
        card.classList.add(UNAVAILABLE_CLASS);
        if (btn) btn.disabled = true;
        const st = card.querySelector('.status');
        if (st) st.textContent = I18N.t('statusSkipped');
      }
    } else {
      if (dot) dot.className = 'dot dot-error';
      if (!window._INSECURE_ORIGIN) {
        card.classList.add(UNAVAILABLE_CLASS);
        if (btn) btn.disabled = true;
        const st = card.querySelector('.status');
        if (st) st.textContent = I18N.t('statusUnavailable');
      }
    }
  }
}

function roomEntity(room) {
  return (room && (room.entity_id || room.entity)) || '';
}

function catalogRooms() {
  const rooms = {};
  for (const [key, room] of Object.entries(window._ROOM_DATA || {})) {
    if (key === 'all') continue;
    rooms[key] = room;
  }
  return rooms;
}

function rebuildRoomGrid(rooms) {
  window._ROOM_DATA = {};
  ROOM_NAMES = {};
  GRID.innerHTML = '';
  window._ROOM_DATA.all = { name: I18N.t('broadcastAll'), name_en: 'All' };
  ROOM_NAMES.all = I18N.t('broadcastAll');
  GRID.appendChild(makeCard('all', I18N.t('broadcastAll'), true));

  if (rooms && typeof rooms === 'object' && !Array.isArray(rooms)) {
    for (const [key, room] of Object.entries(rooms)) {
      window._ROOM_DATA[key] = room;
      ROOM_NAMES[key] = room.name;
      GRID.appendChild(makeCard(key, room.name, false));
    }
  }
  if (typeof window.renderRoomsSettings === 'function') window.renderRoomsSettings();
  if (typeof window.renderDevices === 'function' && window._DEVICES) window.renderDevices();
}

async function loadRooms() {
  try {
    const resp = await fetch((window.API_BASE || '') + '/rooms', { credentials: 'same-origin', headers: authHeaders() });
    const rooms = await resp.json();
    rebuildRoomGrid(rooms);
  } catch (e) {
    rebuildRoomGrid({});
    const firstStatus = GRID.querySelector('.status');
    if (firstStatus) firstStatus.textContent = I18N.t('statusLoadFailed');
  }
}

function setCardState(card, state, msg) {
  ['recording','sending','sent'].forEach(c => card.classList.remove(c));
  if (state) card.classList.add(state);
  card.querySelector('.status').textContent = msg;
}

// ——— Device list + pending approval (issues #52, #51) ———
// window._DEVICES caches the last fetch so language switches re-render instantly.
window._DEVICES = null;

window.renderDevices = function () {
  const section = document.getElementById('devices-section');
  const list = document.getElementById('devices-list');
  const devices = window._DEVICES;
  if (!devices || !Object.keys(devices).length) {
    section.hidden = true;
    return;
  }
  const macs = Object.keys(devices).sort((a, b) => {
    const na = devices[a].name || a;
    const nb = devices[b].name || b;
    const byName = na.localeCompare(nb);
    return byName || a.localeCompare(b);
  });
  list.innerHTML = '';
  let anyPending = false;
  for (const mac of macs) {
    const d = devices[mac];
    const pending = !!d.pending;
    const revoked = !!d.revoked;
    const online = !revoked && !pending && deviceIsOnline(d.last_seen);
    if (pending) anyPending = true;

    const card = el('article',
      'device-card' + (pending ? ' pending' : '') + (revoked ? ' revoked' : '') + (online ? ' online' : ''));

    const top = el('div', 'device-card-top');
    const identity = el('div', 'device-card-identity');
    const title = el('div', 'device-card-title');
    const dotState = online ? ' on' : pending ? ' wait' : ' off';
    title.appendChild(el('span', 'device-card-dot' + dotState));
    title.appendChild(el('span', 'device-card-name', d.name || mac));
    identity.appendChild(title);
    identity.appendChild(el('div', 'device-card-mac', mac));

    const badges = el('div', 'device-card-badges');
    if (pending) badges.appendChild(el('span', 'device-badge pending', I18N.t('devicePending')));
    if (revoked) badges.appendChild(el('span', 'device-badge revoked', I18N.t('deviceRevoked')));
    if (!pending && !revoked) {
      badges.appendChild(el('span', 'device-badge ' + (online ? 'online' : 'offline'),
        I18N.t(online ? 'deviceOnline' : 'deviceOffline')));
      if (d.firmware_update_available) {
        badges.appendChild(el('span', 'device-badge update', I18N.t('deviceUpdateAvailable')));
      }
    }
    top.appendChild(identity);
    top.appendChild(badges);

    const meta = [];
    if (d.room && ROOM_NAMES[d.room]) meta.push(ROOM_NAMES[d.room]);
    const fw = d.firmware_version || '';
    const latestFw = d.firmware_latest || '';
    if (fw && latestFw && d.firmware_update_available) meta.push(fw + ' → ' + latestFw);
    else if (fw) meta.push(fw);
    meta.push(formatDeviceSeen(d.last_seen));

    const actions = el('div', 'device-card-actions');
    actions.appendChild(deviceActionButton(
      I18N.t(pending ? 'deviceApprove' : 'deviceDeapprove'),
      pending ? 'primary' : '',
      () => manageDevice(mac, pending ? 'approve' : 'deapprove', card)
    ));
    actions.appendChild(deviceActionButton(
      I18N.t(revoked ? 'deviceUnrevoke' : 'deviceRevoke'),
      revoked ? 'primary' : '',
      () => manageDevice(mac, revoked ? 'unrevoke' : 'revoke', card)
    ));
    const needsUpdate = !!d.firmware_update_available;
    const upToDate = !!(d.firmware_latest && !needsUpdate);
    const updateBtn = deviceActionButton(
      I18N.t('deviceUpdate'),
      needsUpdate && online ? 'primary' : '',
      () => {
        if (!confirm(I18N.t('deviceUpdateConfirm'))) return;
        manageDevice(mac, 'ota', card);
      },
      !online || !needsUpdate
    );
    if (upToDate && online) updateBtn.title = I18N.t('deviceUpToDate');
    actions.appendChild(updateBtn);
    actions.appendChild(deviceActionButton(I18N.t('deviceDelete'), 'danger', () => {
      if (!confirm(I18N.t('deviceDeleteConfirm'))) return;
      manageDevice(mac, 'delete', card);
    }));

    card.appendChild(top);
    card.appendChild(el('div', 'device-card-meta', meta.join(' · ')));
    card.appendChild(devicePinsBlock(mac, d));
    card.appendChild(actions);
    list.appendChild(card);
  }
  section.hidden = false;
  if (anyPending) {
    const toggle = document.getElementById('devices-toggle');
    if (toggle) toggle.setAttribute('aria-expanded', 'true');
    list.hidden = false;
  }
};

function el(tag, className, text) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text != null && text !== '') n.textContent = text;
  return n;
}

function deviceActionButton(label, extraClass, onClick, disabled) {
  const btn = el('button', 'device-action' + (extraClass ? ' ' + extraClass : ''), label);
  btn.type = 'button';
  if (disabled) {
    btn.disabled = true;
  }
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    onClick();
  });
  return btn;
}

function deviceGpioList(device) {
  const pins = Array.isArray(device.pins) ? device.pins : [];
  const buttons = (device.buttons && typeof device.buttons === 'object') ? device.buttons : {};
  const set = new Set();
  pins.forEach((p) => set.add(String(p)));
  Object.keys(buttons).forEach((k) => set.add(String(k)));
  return [...set].sort((a, b) => Number(a) - Number(b));
}

function devicePinsBlock(mac, device) {
  const wrap = el('div', 'device-pins');
  wrap.appendChild(el('div', 'device-pins-title', I18N.t('devicePinsTitle')));
  const gpios = deviceGpioList(device);
  if (!gpios.length) {
    wrap.appendChild(el('div', 'device-pins-pending', I18N.t('devicePinsPending')));
    return wrap;
  }
  const rooms = catalogRooms();
  const assigned = (device.buttons && typeof device.buttons === 'object') ? device.buttons : {};
  gpios.forEach((gpio) => {
    const row = el('div', 'device-pin-row');
    row.appendChild(el('span', 'device-pin-gpio', I18N.t('devicePinGpio').replace('%s', gpio)));
    const select = document.createElement('select');
    select.dataset.gpio = gpio;
    const unset = document.createElement('option');
    unset.value = '';
    unset.textContent = I18N.t('devicePinUnassigned');
    select.appendChild(unset);
    const current = assigned[gpio] || '';
    Object.keys(rooms).forEach((key) => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = rooms[key].name || key;
      select.appendChild(opt);
    });
    if (current && !rooms[current]) {
      const missing = document.createElement('option');
      missing.value = current;
      missing.disabled = true;
      missing.selected = true;
      missing.textContent = playerMissingLabel(current);
      select.appendChild(missing);
    } else {
      select.value = current;
    }
    select.addEventListener('change', () => saveDeviceButtons(mac, wrap.closest('.device-card')));
    row.appendChild(select);
    wrap.appendChild(row);
  });
  return wrap;
}

function saveDeviceButtons(mac, card) {
  if (!card) return;
  const buttons = {};
  card.querySelectorAll('select[data-gpio]').forEach((sel) => {
    const room = sel.value.trim();
    if (room) buttons[sel.dataset.gpio] = room;
  });
  manageDevice(mac, 'buttons', card, { buttons });
}

function deviceIsOnline(lastSeen) {
  const t = Date.parse(lastSeen || '');
  return !Number.isNaN(t) && (Date.now() - t) <= 30 * 1000;
}

function refreshDevicesIfVisible() {
  if (document.visibilityState === 'hidden') return;
  loadDevices();
}

function formatDeviceSeen(lastSeen) {
  const t = Date.parse(lastSeen || '');
  if (Number.isNaN(t)) return I18N.t('deviceNeverSeen');
  const sec = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (sec < 45) return I18N.t('deviceJustNow');
  if (sec < 3600) return I18N.t('deviceMinutesAgo').replace('%s', String(Math.max(1, Math.floor(sec / 60))));
  if (sec < 86400) return I18N.t('deviceHoursAgo').replace('%s', String(Math.max(1, Math.floor(sec / 3600))));
  return String(lastSeen).replace('T', ' ').slice(0, 16);
}

async function manageDevice(mac, action, card, extra) {
  if (card) card.classList.add('busy');
  try {
    const resp = await fetch((window.API_BASE || '') + '/devices/manage', {
      method: 'POST',
      credentials: 'same-origin',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ mac, action, ...(extra || {}) }),
    });
    if (resp.ok) await loadDevices();
  } catch (e) { /* ignore */ }
  if (card) card.classList.remove('busy');
}

function initDevicesToggle() {
  const toggle = document.getElementById('devices-toggle');
  const list = document.getElementById('devices-list');
  if (!toggle || !list || toggle.dataset.bound) return;
  toggle.dataset.bound = '1';
  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') !== 'true';
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    list.hidden = !open;
  });
}

async function loadDevices() {
  try {
    const resp = await fetch((window.API_BASE || '') + '/devices', {
      credentials: 'same-origin',
      headers: authHeaders(),
    });
    if (!resp.ok) return; // 401/404: stay hidden
    window._DEVICES = await resp.json();
    window.renderDevices();
  } catch (e) { /* network error: stay hidden */ }
}

async function startRecording(target, card) {
  currentTarget = target;
  currentCard = card;
  audioChunks = [];

  if (card.classList.contains(UNAVAILABLE_CLASS)) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      mediaRecorder = null;
      processAndSend();
    };
    mediaRecorder.start();
    setCardState(card, 'recording', I18N.t('statusRecording'));
  } catch (e) {
    setCardState(card, '', I18N.t('micError') + e.message);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    setCardState(currentCard, 'sending', I18N.t('statusSending'));
  }
}

async function decodeAndResampleToInt16(arrayBuffer, maxDurationSecs) {
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuf = await actx.decodeAudioData(arrayBuffer.slice(0));
  const srcRate = audioBuf.sampleRate;
  const srcData = audioBuf.getChannelData(0);
  actx.close();

  const duration = srcData.length / srcRate;
  if (maxDurationSecs && duration > maxDurationSecs) {
    throw new Error('too_long');
  }

  const offlineCtx = new OfflineAudioContext(1, Math.ceil(duration * TARGET_RATE), TARGET_RATE);
  const bufferSrc = offlineCtx.createBufferSource();
  const offlineBuf = offlineCtx.createBuffer(1, srcData.length, srcRate);
  offlineBuf.copyToChannel(srcData, 0);
  bufferSrc.buffer = offlineBuf;
  bufferSrc.connect(offlineCtx.destination);
  bufferSrc.start(0);

  const rendered = await offlineCtx.startRendering();
  const resampled = rendered.getChannelData(0);
  const pcm = new Int16Array(resampled.length);
  for (let i = 0; i < resampled.length; i++) {
    const s = Math.max(-1, Math.min(1, resampled[i]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return pcm;
}

function encodeWav(int16, sampleRate) {
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
  const blockAlign = numChannels * (bitsPerSample / 8);
  const dataSize = int16.length * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < int16.length; i++, offset += 2) {
    view.setInt16(offset, int16[i], true);
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

async function processAndSend() {
  const webm = new Blob(audioChunks, { type: 'audio/webm' });
  let sentCurrent = true;

  try {
    const arrayBuf = await webm.arrayBuffer();
    const pcm = await decodeAndResampleToInt16(arrayBuf);

    const resp = await fetch(RECORD_URL + '?target=' + currentTarget + '&rate=' + TARGET_RATE, {
      method: 'POST',
      credentials: 'same-origin',
      headers: authHeaders(),
      body: new Blob([new Uint8Array(pcm.buffer, 0, pcm.byteLength)]),
    });

    if (resp.ok) {
      const data = await resp.json();
      const errors = data.errors || [];
      sentCurrent = true;  // show "sent" unless current card is an error card
      if (errors.length > 0) {
        // Map entity → room key for card lookup
        const entityToKey = {};
        for (const [key, room] of Object.entries(window._ROOM_DATA || {})) {
          const entityId = roomEntity(room);
          if (entityId) entityToKey[entityId] = key;
        }
        // Show error on each skipped room's card
        for (const e of errors) {
          const key = entityToKey[e.entity_id];
          if (!key) continue;
          const card = document.getElementById('card-' + key);
          if (!card) continue;
          if (card === currentCard) sentCurrent = false;
          // Turn dot red
          const dot = card.querySelector('.dot');
          if (dot) dot.className = 'dot dot-error';
          const ERROR_MSG = {
            [EntityStatus.UNAVAILABLE]: I18N.t('statusUnavailable'),
            [PlayError.PLAY_FAILED]:    I18N.t('statusPlayFailed'),
            [PlayError.MA_FAILED]:      I18N.t('statusMAFailed'),
          };
          const msg = ERROR_MSG[e.error] || I18N.t('statusSkipped');
          setCardState(card, '', msg);
        }
      }
      if (sentCurrent) setCardState(currentCard, 'sent', I18N.t('statusSent'));
    } else if (resp.status === 401 && !sessionStorage.getItem(RELOAD_ONCE_KEY)) {
      // Issue #54: page holds a stale token (HA restarted, .storage reset,
      // backup restored) — reload once to pick up the fresh injected token.
      sessionStorage.setItem(RELOAD_ONCE_KEY, '1');
      location.reload();
      return;
    } else {
      setCardState(currentCard, '', I18N.t('statusFailed') + ' ' + resp.status);
    }
  } catch (e) {
    setCardState(currentCard, '', I18N.t('statusNetworkError'));
    console.error('processAndSend:', e);
  }

  setTimeout(() => {
    if (currentCard && sentCurrent) setCardState(currentCard, '', I18N.t('statusReady'));
  }, 1500);
}

async function pollSpeakerStatus() {
  try {
    const resp = await fetch((window.API_BASE || '') + '/rooms/status', { credentials: 'same-origin' });
    if (!resp.ok) throw new Error('status unavailable');
    const status = await resp.json();
    if (status.error) throw new Error(status.error);
    applyRoomStatus(status);
    haStatusLoaded = true;
  } catch (e) {
    if (!haStatusLoaded) applyPreviewFallback();
  }
}

// --- Room catalog settings (issue #74) ---
const ROOMS_URL = (window.API_BASE || '') + '/rooms';
const MEDIA_PLAYERS_URL = (window.API_BASE || '') + '/media_players';
window._MEDIA_PLAYERS = [];

function setRoomsMsg(text) {
  const node = document.getElementById('rooms-msg');
  if (node) node.textContent = text || '';
}

function playerLabel(player) {
  if (!player) return '';
  const area = (player.area || '').trim();
  const name = player.name || player.entity_id;
  return area ? area + ' · ' + name : name;
}

function playerById(entityId) {
  return (window._MEDIA_PLAYERS || []).find((p) => p.entity_id === entityId) || null;
}

function slugRoomId(entityId, existingKeys) {
  let base = String(entityId || '').replace(/^media_player\./, '');
  base = base.replace(/[^a-zA-Z0-9_-]/g, '_').replace(/^[^a-zA-Z0-9]+/, '').slice(0, 64);
  if (!base) base = 'room';
  let id = base;
  let n = 2;
  const taken = existingKeys || new Set();
  while (taken.has(id) || id.toLowerCase() === 'all' || id.toLowerCase() === 'status') {
    const suffix = '_' + n;
    id = (base.slice(0, Math.max(1, 64 - suffix.length)) + suffix);
    n += 1;
  }
  return id;
}

function optionalNumber(input, { integer } = {}) {
  const raw = (input && input.value != null) ? String(input.value).trim() : '';
  if (raw === '') return 0;
  const n = integer ? parseInt(raw, 10) : parseFloat(raw);
  return Number.isFinite(n) ? n : 0;
}

function playerMissingLabel(entityId) {
  return I18N.t('roomsPlayerRemoved').replace('%s', entityId || '');
}

function fillPlayerSelect(selected) {
  const select = document.getElementById('room-player');
  if (!select) return;
  const players = window._MEDIA_PLAYERS || [];
  const missing = !!(selected && !players.some((p) => p.entity_id === selected));
  select.innerHTML = '';
  select.classList.toggle('rooms-player-missing', missing);
  if (!players.length && !missing) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = I18N.t('roomsNoPlayers');
    select.appendChild(opt);
    select.disabled = true;
    return;
  }
  select.disabled = !players.length;
  const groups = new Map();
  const ungrouped = [];
  for (const player of players) {
    const area = (player.area || '').trim();
    if (area) {
      if (!groups.has(area)) groups.set(area, []);
      groups.get(area).push(player);
    } else {
      ungrouped.push(player);
    }
  }
  const addOption = (parent, player) => {
    const opt = document.createElement('option');
    opt.value = player.entity_id;
    opt.textContent = player.name || player.entity_id;
    parent.appendChild(opt);
  };
  for (const [area, list] of groups) {
    const group = document.createElement('optgroup');
    group.label = area;
    list.forEach((p) => addOption(group, p));
    select.appendChild(group);
  }
  ungrouped.forEach((p) => addOption(select, p));
  if (missing) {
    const opt = document.createElement('option');
    opt.value = selected;
    opt.disabled = true;
    opt.selected = true;
    opt.textContent = playerMissingLabel(selected);
    select.appendChild(opt);
  } else if (selected) {
    select.value = selected;
  }
}

async function loadMediaPlayers() {
  try {
    const resp = await fetch(MEDIA_PLAYERS_URL, {
      credentials: 'same-origin',
      headers: authHeaders(),
    });
    if (!resp.ok) {
      window._MEDIA_PLAYERS = [];
    } else {
      const data = await resp.json();
      window._MEDIA_PLAYERS = Array.isArray(data) ? data : [];
    }
  } catch (e) {
    window._MEDIA_PLAYERS = [];
  }
  const editId = document.getElementById('room-edit-id');
  const form = document.getElementById('rooms-form');
  if (form && !form.hidden) {
    fillPlayerSelect(document.getElementById('room-player').value);
  } else if (editId) {
    fillPlayerSelect(editId.value ? roomEntity((window._ROOM_DATA || {})[editId.value]) : '');
  }
}

function roomsFormOpen() {
  const form = document.getElementById('rooms-form');
  return !!(form && !form.hidden);
}

window.renderRoomsSettings = function () {
  const list = document.getElementById('rooms-list');
  const empty = document.getElementById('rooms-empty');
  const addBtn = document.getElementById('rooms-add');
  const volumeEl = document.getElementById('room-volume');
  const pauseEl = document.getElementById('room-pause');
  if (volumeEl) volumeEl.placeholder = I18N.t('roomsVolumeHint');
  if (pauseEl) pauseEl.placeholder = I18N.t('roomsPauseHint');
  if (!list) return;
  const rooms = catalogRooms();
  const keys = Object.keys(rooms);
  const formOpen = roomsFormOpen();
  list.innerHTML = '';
  if (empty) empty.hidden = formOpen || keys.length > 0;
  if (addBtn) addBtn.hidden = formOpen;
  if (formOpen) {
    fillPlayerSelect(document.getElementById('room-player').value);
    return;
  }

  for (const key of keys) {
    const room = rooms[key];
    const entityId = roomEntity(room);
    const player = playerById(entityId);
    const row = el('div', 'rooms-row');
    const info = el('div', 'rooms-row-info');
    info.appendChild(el('div', 'rooms-row-name', room.name || key));
    const entityClass = player || !entityId ? 'rooms-row-entity' : 'rooms-row-entity rooms-row-entity-missing';
    info.appendChild(el('div', entityClass, player ? playerLabel(player) : (entityId ? playerMissingLabel(entityId) : '')));
    const actions = el('div', 'rooms-row-actions');
    actions.appendChild(deviceActionButton(I18N.t('roomsEdit'), '', () => openRoomForm(key)));
    actions.appendChild(deviceActionButton(I18N.t('roomsDelete'), 'danger', () => deleteRoom(key)));
    row.appendChild(info);
    row.appendChild(actions);
    list.appendChild(row);
  }
};

function resetRoomFormState() {
  const form = document.getElementById('rooms-form');
  const editId = document.getElementById('room-edit-id');
  const nameEl = document.getElementById('room-name');
  const volumeEl = document.getElementById('room-volume');
  const pauseEl = document.getElementById('room-pause');
  const playerEl = document.getElementById('room-player');
  if (form) form.hidden = true;
  if (editId) editId.value = '';
  if (nameEl) {
    nameEl.value = '';
    nameEl.dataset.fromPlayer = '0';
  }
  if (volumeEl) volumeEl.value = '';
  if (pauseEl) pauseEl.value = '';
  if (playerEl) playerEl.classList.remove('rooms-player-missing');
}

function closeRoomForm() {
  resetRoomFormState();
  window.renderRoomsSettings();
}

function openRoomForm(roomId) {
  const form = document.getElementById('rooms-form');
  const editId = document.getElementById('room-edit-id');
  const nameEl = document.getElementById('room-name');
  const volumeEl = document.getElementById('room-volume');
  const pauseEl = document.getElementById('room-pause');
  const addBtn = document.getElementById('rooms-add');
  const empty = document.getElementById('rooms-empty');
  const list = document.getElementById('rooms-list');
  if (!form || !nameEl) return;
  setRoomsMsg('');
  const room = roomId ? (window._ROOM_DATA || {})[roomId] : null;
  editId.value = roomId || '';
  nameEl.value = room ? (room.name || '') : '';
  nameEl.dataset.fromPlayer = roomId ? '0' : '1';
  volumeEl.value = room && room.announce_volume ? String(room.announce_volume) : '';
  pauseEl.value = room && room.pause_buffer ? String(room.pause_buffer) : '';
  fillPlayerSelect(room ? roomEntity(room) : '');
  if (!roomId) {
    const select = document.getElementById('room-player');
    const first = select && !select.disabled ? select.value : '';
    const player = playerById(first);
    if (player && !nameEl.value) nameEl.value = player.name || '';
  }
  form.hidden = false;
  if (addBtn) addBtn.hidden = true;
  if (empty) empty.hidden = true;
  if (list) list.innerHTML = '';
  nameEl.focus();
}

function roomsErrorMessage(error, status) {
  if (status === 401) return I18N.t('roomsSaveFail');
  if (error === 'yaml_read_only') return I18N.t('roomsErrorYaml');
  if (error === 'no writable config entry') return I18N.t('roomsErrorNoEntry');
  if (error === 'unknown room') return I18N.t('roomsErrorUnknown');
  if (error === 'cannot persist rooms') return I18N.t('roomsSaveFail');
  return error || I18N.t('roomsSaveFail');
}

async function saveRoom(e) {
  e.preventDefault();
  setRoomsMsg('');
  const editId = document.getElementById('room-edit-id').value.trim();
  const name = document.getElementById('room-name').value.trim();
  const entityId = document.getElementById('room-player').value.trim();
  if (!name || !entityId) {
    setRoomsMsg(I18N.t('roomsSaveFail'));
    return;
  }
  const existing = new Set(Object.keys(catalogRooms()));
  const roomId = editId || slugRoomId(entityId, existing);
  const body = {
    name,
    entity_id: entityId,
    announce_volume: optionalNumber(document.getElementById('room-volume'), { integer: true }),
    pause_buffer: optionalNumber(document.getElementById('room-pause')),
  };
  try {
    const resp = await fetch(ROOMS_URL + '/' + encodeURIComponent(roomId), {
      method: editId ? 'PATCH' : 'PUT',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    });
    if (resp.status === 401 && !sessionStorage.getItem(RELOAD_ONCE_KEY)) {
      sessionStorage.setItem(RELOAD_ONCE_KEY, '1');
      location.reload();
      return;
    }
    let data = {};
    try { data = await resp.json(); } catch (err) { data = {}; }
    if (!resp.ok) {
      setRoomsMsg(roomsErrorMessage(data.error, resp.status));
      return;
    }
    if (data.rooms && typeof data.rooms === 'object') rebuildRoomGrid(data.rooms);
    else await loadRooms();
    closeRoomForm();
    setRoomsMsg(I18N.t('roomsSaved'));
    pollSpeakerStatus();
  } catch (err) {
    setRoomsMsg(I18N.t('roomsSaveFail'));
    console.error('saveRoom:', err);
  }
}

async function deleteRoom(roomId) {
  if (!confirm(I18N.t('roomsDeleteConfirm'))) return;
  setRoomsMsg('');
  try {
    const resp = await fetch(ROOMS_URL + '/' + encodeURIComponent(roomId), {
      method: 'DELETE',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: authHeaders(),
    });
    if (resp.status === 401 && !sessionStorage.getItem(RELOAD_ONCE_KEY)) {
      sessionStorage.setItem(RELOAD_ONCE_KEY, '1');
      location.reload();
      return;
    }
    let data = {};
    try { data = await resp.json(); } catch (err) { data = {}; }
    if (!resp.ok) {
      setRoomsMsg(roomsErrorMessage(data.error, resp.status));
      return;
    }
    if (data.rooms && typeof data.rooms === 'object') rebuildRoomGrid(data.rooms);
    else await loadRooms();
    setRoomsMsg(I18N.t('roomsDeleted'));
    pollSpeakerStatus();
  } catch (err) {
    setRoomsMsg(I18N.t('roomsSaveFail'));
    console.error('deleteRoom:', err);
  }
}

function initRoomsSettings() {
  const addBtn = document.getElementById('rooms-add');
  const form = document.getElementById('rooms-form');
  const cancelBtn = document.getElementById('rooms-cancel');
  const nameEl = document.getElementById('room-name');
  const playerEl = document.getElementById('room-player');
  if (!form || form.dataset.bound) return;
  form.dataset.bound = '1';

  addBtn?.addEventListener('click', () => {
    loadMediaPlayers().then(() => openRoomForm(''));
  });
  cancelBtn?.addEventListener('click', () => {
    setRoomsMsg('');
    closeRoomForm();
  });
  form.addEventListener('submit', saveRoom);
  playerEl?.addEventListener('change', () => {
    if (document.getElementById('room-edit-id').value) return;
    const player = playerById(playerEl.value);
    if (player && (nameEl.dataset.fromPlayer === '1' || !nameEl.value.trim())) {
      nameEl.value = player.name || '';
      nameEl.dataset.fromPlayer = '1';
    }
  });
  nameEl?.addEventListener('input', () => {
    nameEl.dataset.fromPlayer = '0';
  });
}

// --- Custom chime settings (issue #66) ---
const CHIME_FILENAME_KEY = 'intercom-chime-display-name';
let chimeState = { custom: false, url: '' };
let chimePreviewAudio = null;
let chimeMetaCache = null;
let chimeMetaLoadId = 0;

function resolveChimePlayUrl(url) {
  const staticBase = (window.STATIC_BASE || '/static').replace(/\/$/, '');
  if (!url) return staticBase + '/pre_announce.wav';
  if (/^https?:\/\//i.test(url)) return url;
  if (url.indexOf('/static/') !== -1) {
    const file = url.split('/static/').pop().replace(/^\//, '');
    return staticBase + '/' + file;
  }
  return url;
}

function setChimeMsg(text) {
  const el = document.getElementById('chime-msg');
  if (el) el.textContent = text || '';
}

function isChimeCustom(state) {
  state = state || chimeState;
  if (state.custom === true) return true;
  if (state.custom === false) return false;
  return /custom_chime\.wav/i.test(state.url || '');
}

function getChimeDisplayFilename() {
  if (!isChimeCustom()) return I18N.t('chimeDefault');
  return localStorage.getItem(CHIME_FILENAME_KEY) || 'custom_chime.wav';
}

function setChimeDisplayFilename(name) {
  if (name) localStorage.setItem(CHIME_FILENAME_KEY, name);
  else localStorage.removeItem(CHIME_FILENAME_KEY);
}

function formatChimeMeta(duration, sampleRate) {
  if (!duration || !sampleRate) return '—';
  const secs = duration < 10 ? duration.toFixed(1) : Math.round(duration).toString();
  const rateKhz = Math.round(sampleRate / 1000);
  return secs + ' s · ' + rateKhz + ' kHz ' + I18N.t('chimeMono');
}

function computeWaveformPeaks(audioBuffer, barCount) {
  const data = audioBuffer.getChannelData(0);
  const blockSize = Math.max(1, Math.floor(data.length / barCount));
  const peaks = [];
  for (let i = 0; i < barCount; i++) {
    let peak = 0;
    const start = i * blockSize;
    for (let j = 0; j < blockSize; j++) {
      peak = Math.max(peak, Math.abs(data[start + j] || 0));
    }
    peaks.push(peak);
  }
  return peaks;
}

function drawChimeWaveform(peaks) {
  const canvas = document.getElementById('chime-waveform');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (!peaks || !peaks.length) return;

  const barW = w / peaks.length;
  const gap = 1;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#555';
  for (let i = 0; i < peaks.length; i++) {
    const barH = Math.max(2, peaks[i] * h * 0.9);
    const x = i * barW + gap / 2;
    const y = (h - barH) / 2;
    ctx.fillRect(x, y, Math.max(1, barW - gap), barH);
  }
}

function updateChimeMetaUI() {
  const filenameEl = document.getElementById('chime-filename');
  const metaEl = document.getElementById('chime-meta');
  if (filenameEl) filenameEl.textContent = getChimeDisplayFilename();
  if (metaEl) {
    metaEl.textContent = chimeMetaCache
      ? formatChimeMeta(chimeMetaCache.duration, chimeMetaCache.sampleRate)
      : '—';
  }
  drawChimeWaveform(chimeMetaCache && chimeMetaCache.peaks);
}

async function loadChimeAudioMeta() {
  const loadId = ++chimeMetaLoadId;
  const src = resolveChimePlayUrl(chimeState.url);
  try {
    const resp = await fetch(src, { credentials: 'same-origin', cache: 'no-store' });
    if (!resp.ok) throw new Error('fetch failed');
    const arrayBuffer = await resp.arrayBuffer();
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuf = await actx.decodeAudioData(arrayBuffer.slice(0));
    actx.close();
    if (loadId !== chimeMetaLoadId) return;
    chimeMetaCache = {
      duration: audioBuf.duration,
      sampleRate: audioBuf.sampleRate,
      peaks: computeWaveformPeaks(audioBuf, 40),
    };
    updateChimeMetaUI();
  } catch (e) {
    if (loadId !== chimeMetaLoadId) return;
    chimeMetaCache = null;
    updateChimeMetaUI();
    console.error('loadChimeAudioMeta:', e);
  }
}

function setChimePlayButton(playing) {
  const btn = document.getElementById('chime-play');
  const icon = btn && btn.querySelector('.chime-play-icon');
  if (!icon) return;
  icon.textContent = playing ? '■' : '▶';
  if (btn) {
    btn.classList.toggle('playing', playing);
    btn.setAttribute('aria-label', I18N.t('chimePreview'));
  }
}

function updateChimeStatusUI() {
  const custom = isChimeCustom();
  const resetBtn = document.getElementById('chime-reset');
  if (resetBtn) {
    resetBtn.disabled = !custom;
    if (custom) resetBtn.removeAttribute('disabled');
    else resetBtn.setAttribute('disabled', '');
  }
  updateChimeMetaUI();
  loadChimeAudioMeta();
}

async function refreshChimeStatus() {
  try {
    const resp = await fetch(CHIME_URL, {
      credentials: 'same-origin',
      cache: 'no-store',
    });
    if (!resp.ok) return;
    chimeState = await resp.json();
    updateChimeStatusUI();
  } catch (e) {
    console.error('refreshChimeStatus:', e);
  }
}

function playChimePreview(audio) {
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      audio.removeEventListener('canplaythrough', onReady);
      audio.removeEventListener('error', onError);
    };
    const onReady = () => {
      cleanup();
      audio.play().then(resolve).catch(reject);
    };
    const onError = () => {
      cleanup();
      reject(audio.error || new Error('audio error'));
    };

    if (audio.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
      audio.play().then(resolve).catch(reject);
      return;
    }

    audio.addEventListener('canplaythrough', onReady, { once: true });
    audio.addEventListener('error', onError, { once: true });
    audio.load();
  });
}

async function previewChime() {
  setChimeMsg('');
  const src = resolveChimePlayUrl(chimeState.url);
  if (chimePreviewAudio) {
    chimePreviewAudio.pause();
    chimePreviewAudio = null;
    setChimePlayButton(false);
  }
  chimePreviewAudio = new Audio(src);
  chimePreviewAudio.addEventListener('ended', () => {
    setChimePlayButton(false);
    chimePreviewAudio = null;
  }, { once: true });
  try {
    setChimePlayButton(true);
    await playChimePreview(chimePreviewAudio);
  } catch (e) {
    setChimePlayButton(false);
    chimePreviewAudio = null;
    setChimeMsg(I18N.t('chimePreviewFail'));
    console.error('previewChime:', e);
  }
}

async function uploadChimeFile(file) {
  if (!file) return;
  setChimeMsg('');
  try {
    const pcm = await decodeAndResampleToInt16(await file.arrayBuffer(), MAX_CHIME_SECS);
    const wav = encodeWav(pcm, TARGET_RATE);
    const resp = await fetch(CHIME_URL, {
      method: 'POST',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: authHeaders({ 'Content-Type': 'application/octet-stream' }),
      body: wav,
    });
    if (resp.ok) {
      const data = await resp.json();
      chimeState = {
        custom: true,
        url: data.url || chimeState.url,
        default_url: chimeState.default_url || ((window.STATIC_BASE || '/static') + '/pre_announce.wav'),
      };
      setChimeDisplayFilename(file.name);
      updateChimeStatusUI();
      setChimeMsg(I18N.t('chimeUploadOk'));
      return;
    }
    if (resp.status === 401 && !sessionStorage.getItem(RELOAD_ONCE_KEY)) {
      sessionStorage.setItem(RELOAD_ONCE_KEY, '1');
      location.reload();
      return;
    }
    let err = I18N.t('chimeUploadFail');
    try {
      const data = await resp.json();
      if (data.error) err = data.error;
    } catch (e) {}
    setChimeMsg(err);
  } catch (e) {
    if (e && e.message === 'too_long') {
      setChimeMsg(I18N.t('chimeUploadTooLong'));
    } else {
      setChimeMsg(I18N.t('chimeUploadFail'));
      console.error('uploadChimeFile:', e);
    }
  }
}

async function resetChime() {
  setChimeMsg('');
  try {
    const resp = await fetch(CHIME_URL, {
      method: 'DELETE',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: authHeaders(),
    });
    if (resp.ok) {
      chimeState = { custom: false, url: '' };
      setChimeDisplayFilename('');
      await refreshChimeStatus();
      setChimeMsg(I18N.t('chimeResetOk'));
      return;
    }
    if (resp.status === 401 && !sessionStorage.getItem(RELOAD_ONCE_KEY)) {
      sessionStorage.setItem(RELOAD_ONCE_KEY, '1');
      location.reload();
      return;
    }
    setChimeMsg(I18N.t('chimeUploadFail'));
  } catch (e) {
    setChimeMsg(I18N.t('chimeUploadFail'));
    console.error('resetChime:', e);
  }
}

function openSettingsPanel() {
  const overlay = document.getElementById('settings-overlay');
  const toggle = document.getElementById('settings-toggle');
  if (!overlay || !toggle) return;
  if (typeof I18N.closeLangDropdown === 'function') I18N.closeLangDropdown();
  if (typeof THEME !== 'undefined' && typeof THEME.closeDropdown === 'function') THEME.closeDropdown();
  overlay.hidden = false;
  toggle.setAttribute('aria-expanded', 'true');
  setChimeMsg('');
  setRoomsMsg('');
  refreshChimeStatus();
  loadMediaPlayers().then(() => {
    if (typeof window.renderRoomsSettings === 'function') window.renderRoomsSettings();
  });
}

function closeSettingsPanel() {
  const overlay = document.getElementById('settings-overlay');
  const toggle = document.getElementById('settings-toggle');
  if (overlay) overlay.hidden = true;
  if (toggle) toggle.setAttribute('aria-expanded', 'false');
  setRoomsMsg('');
  closeRoomForm();
  if (chimePreviewAudio) {
    chimePreviewAudio.pause();
    chimePreviewAudio = null;
    setChimePlayButton(false);
  }
}

function initChimeSettings() {
  const toggle = document.getElementById('settings-toggle');
  const overlay = document.getElementById('settings-overlay');
  const closeBtn = document.getElementById('settings-close');
  const playBtn = document.getElementById('chime-play');
  const resetBtn = document.getElementById('chime-reset');
  const fileInput = document.getElementById('chime-file');
  if (!toggle || !overlay) return;

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (overlay.hidden) openSettingsPanel();
    else closeSettingsPanel();
  });

  closeBtn?.addEventListener('click', closeSettingsPanel);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeSettingsPanel();
  });
  overlay.querySelector('.settings-panel')?.addEventListener('click', (e) => e.stopPropagation());

  playBtn?.addEventListener('click', previewChime);
  resetBtn?.addEventListener('click', resetChime);
  fileInput?.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    uploadChimeFile(file);
    e.target.value = '';
  });

  window.addEventListener('resize', () => {
    drawChimeWaveform(chimeMetaCache && chimeMetaCache.peaks);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay && !overlay.hidden) closeSettingsPanel();
  });

  const closeLabel = I18N.t('settingsClose');
  if (closeBtn) closeBtn.setAttribute('aria-label', closeLabel);
  toggle.setAttribute('aria-label', I18N.t('settingsTitle'));
  if (playBtn) playBtn.setAttribute('aria-label', I18N.t('chimePreview'));
  updateChimeStatusUI();
}

window.updateChimeStatusUI = updateChimeStatusUI;

// Detect insecure context (HTTP without localhost) — getUserMedia requires HTTPS
(function checkSecureContext() {
  if (!window.isSecureContext) {
    window._INSECURE_ORIGIN = true;

    var banner = document.createElement('div');
    banner.className = 'insecure-banner';
    banner.innerHTML =
      '<div class="insecure-icon" aria-hidden="true">🔒</div>' +
      '<div>' +
        '<div class="insecure-title" data-i18n="secInsecureTitle">' + I18N.t('secInsecureTitle') + '</div>' +
        '<div class="insecure-hint" data-i18n="secInsecureHint">' + I18N.t('secInsecureHint') + '</div>' +
      '</div>';
    var grid = document.getElementById('grid');
    if (grid) grid.parentNode.insertBefore(banner, grid);
  }
})();

loadRooms().then(() => { pollSpeakerStatus(); loadDevices(); });
setInterval(pollSpeakerStatus, 30000);
setInterval(refreshDevicesIfVisible, 10000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  loadDevices();
  pollSpeakerStatus();
});
initDevicesToggle();
initRoomsSettings();
initChimeSettings();

// Show version number
fetch((window.API_BASE || '') + '/version', { credentials: 'same-origin' }).then(r => r.json()).then(d => {
  document.getElementById('ver').textContent = d.version;
}).catch(() => {
  document.getElementById('ver').textContent = '';
});
</script>
